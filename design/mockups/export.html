<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyBeats · 工程与导出</title>
<link rel="stylesheet" href="shared.css">
<script src="shared.js" defer></script>
</head>
<!-- 画面 4：工程与导出。右侧面板换成工程抽屉：自动保存状态、作品列表、导出格式（txt / LRC / 工程文件 / Reaper .RPP + 分轨）。 -->
<body data-screen="export" data-playing="0" data-played="0.62" data-panel="export" data-mtab="proj" data-sheet="tall" data-mfold="0,1"
      data-pos-bar="10 · 2 · 1" data-pos-time="0:24.0 / 1:52" data-status-right="可撤销 38 步 · 本机自动保存">
<template id="status-left"><span><kbd>⌘Z</kbd> 撤销</span><span><kbd>⇧⌘Z</kbd> 重做</span><span><kbd>⌘S</kbd> 立即保存</span><span><kbd>⌘E</kbd> 导出</span></template>
<template id="panel">
  <div class="kv"><span><span class="dot"></span><span data-contrast>本机自动保存</span></span><span class="muted">改动后 2 秒存一次 · 12:41:08</span></div>
  <div class="li mob-only" style="padding:0"><span>作品列表（3）</span><span class="r"><small>新建 · 另存为 · 打开 ›</small></span></div>
  <div class="desk-only" style="flex-direction:column">
    <div class="ph" style="margin-bottom:2px"><span class="lbl">作品</span><button class="btn sm ghost r">新建</button><button class="btn sm ghost">另存为</button></div>
    <div class="list">
      <div class="li on"><span data-contrast>夜车</span><small>当前 · 10 小节</small><span class="r"><small>今天 12:41</small></span></div>
      <div class="li"><span>地下室</span><small>24 小节</small><span class="r"><small>10-20</small><button class="ibtn" data-icon="close" title="删除"></button></span></div>
      <div class="li desk-only"><span>示例：街头节奏</span><small>示例</small><span class="r"><small>内置</small></span></div>
    </div>
  </div>
  <div>
    <div class="ph" style="margin-bottom:2px"><span class="lbl">导出</span></div>
    <div class="list">
      <div class="li"><span class="check on"></span><span>歌词 .txt</span><small>按段落分行</small></div>
      <div class="li"><span class="check on"></span><span>同步歌词 .lrc</span><small>每小节时间戳</small></div>
      <div class="li"><span class="check on"></span><span>工程文件 .anybeats</span><small>可再导入</small></div>
      <div class="li"><span class="check on"></span><span data-contrast>Reaper 工程 .RPP + 分轨</span></div>
    </div>
    <div class="seg" style="padding-left:28px"><button class="on">伴奏</button><button class="on">Take 2 ★</button><button>节拍器</button><button>导唱</button></div>
  </div>
  <button class="btn primary block">导出 4 项到 下载/AnyBeats/夜车</button>
  <button class="btn sm ghost danger desk-only" style="align-self:flex-start">清空当前歌词…</button>
</template>
</body>
</html>
